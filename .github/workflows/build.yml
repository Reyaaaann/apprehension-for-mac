name: Build
on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --target Apprehension_VST3
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\apprehension.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Apprehension-Windows
          path: installer/Output/Apprehension-Setup.exe

  macos:
    runs-on: macos-latest
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Engine tests (informational)
        continue-on-error: true
        run: |
          clang++ -std=c++17 -O2 test/test_dsp.cpp -o dsp_tests
          ./dsp_tests | tail -5

      - name: "Configure (universal binary for Apple Silicon and Intel)"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Audio Unit
        run: cmake --build build --config Release --target Apprehension_VST3 Apprehension_AU --parallel 4

      - name: Package (unsigned installer)
        run: |
          set -euo pipefail
          VST3=$(find build -name "Apprehension.vst3" -type d | head -n 1)
          AU=$(find build -name "Apprehension.component" -type d | head -n 1)
          echo "VST3: $VST3"; echo "AU: $AU"
          lipo -archs "$VST3/Contents/MacOS/Apprehension" || true
          mkdir -p payload/Library/Audio/Plug-Ins/VST3 payload/Library/Audio/Plug-Ins/Components
          mkdir -p "payload/Library/Application Support/Reyaan/Apprehension"
          cp -R "$VST3" payload/Library/Audio/Plug-Ins/VST3/
          cp -R "$AU" payload/Library/Audio/Plug-Ins/Components/
          cp assets/manual.html "payload/Library/Application Support/Reyaan/Apprehension/Apprehension Manual.html"
          for b in payload/Library/Audio/Plug-Ins/VST3/Apprehension.vst3 payload/Library/Audio/Plug-Ins/Components/Apprehension.component; do
            codesign --force --deep --sign - "$b"
          done
          mkdir -p pkgscripts && cp mac/postinstall pkgscripts/postinstall && chmod +x pkgscripts/postinstall
          pkgbuild --root payload --scripts pkgscripts --identifier com.reyaan.apprehension --version 1.3.1 --install-location / Apprehension-component.pkg
          productbuild --package Apprehension-component.pkg Apprehension-macOS.pkg
          mkdir -p zipdir
          cp -R payload/Library/Audio/Plug-Ins/VST3/Apprehension.vst3 payload/Library/Audio/Plug-Ins/Components/Apprehension.component zipdir/
          cp mac/README_MAC.txt zipdir/
          ditto -c -k --keepParent zipdir Apprehension-macOS-plugins.zip

      - name: Sign and notarize (runs only if you added the Apple secrets)
        if: env.APPLE_CERT_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$APPLE_CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import cert.p12 -k ci.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          for b in payload/Library/Audio/Plug-Ins/VST3/Apprehension.vst3 payload/Library/Audio/Plug-Ins/Components/Apprehension.component; do
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_APP_IDENTITY" "$b"
          done
          pkgbuild --root payload --scripts pkgscripts --identifier com.reyaan.apprehension --version 1.3.1 --install-location / Apprehension-component.pkg
          productbuild --package Apprehension-component.pkg --sign "$APPLE_INSTALLER_IDENTITY" Apprehension-macOS.pkg
          xcrun notarytool submit Apprehension-macOS.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple Apprehension-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: Apprehension-macOS
          path: |
            Apprehension-macOS.pkg
            Apprehension-macOS-plugins.zip
